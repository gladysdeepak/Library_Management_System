<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body {
            padding: 20px;
            background: url('https://images.unsplash.com/photo-1507842217343-583bb7270b66?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            position: relative;
        }
        
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(255, 255, 255, 0.85);
            z-index: -1;
        }
        
        .container {
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        }
        
        h1 {
            color: #343a40;
            font-weight: bold;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.1);
        }
        
        .nav-card {
            transition: transform 0.2s;
            margin-bottom: 20px;
            border: none;
            border-radius: 10px;
            overflow: hidden;
            background-color: rgba(255, 255, 255, 0.95);
        }
        
        .nav-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
        }
        
        .card-body {
            padding: 25px;
        }
        
        .bi {
            margin-bottom: 15px;
        }
        
        .btn {
            width: 100%;
            font-weight: 500;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center mb-4">Welcome to the Library Management System</h1>
        
        <!-- Navigation Cards -->
        <div class="row">
            <div class="col-md-3 mb-4">
                <div class="card nav-card h-100">
                    <div class="card-body text-center">
                        <i class="bi bi-people-fill fs-1 text-primary"></i>
                        <h3>Users</h3>
                        <a href="/users" class="btn btn-primary">Manage Users</a>
                    </div>
                </div>
            </div>
            
            <div class="col-md-3 mb-4">
                <div class="card nav-card h-100">
                    <div class="card-body text-center">
                        <i class="bi bi-book-fill fs-1 text-success"></i>
                        <h3>Books</h3>
                        <a href="/books" class="btn btn-success">Manage Books</a>
                    </div>
                </div>
            </div>
            
            <div class="col-md-3 mb-4">
                <div class="card nav-card h-100">
                    <div class="card-body text-center">
                        <i class="bi bi-clipboard-check-fill fs-1 text-warning"></i>
                        <h3>Borrowings</h3>
                        <a href="/borrowings" class="btn btn-warning">Manage Borrowings</a>
                    </div>
                </div>
            </div>
            
            <div class="col-md-3 mb-4">
                <div class="card nav-card h-100">
                    <div class="card-body text-center">
                        <i class="bi bi-trophy-fill fs-1 text-danger"></i>
                        <h3>Top Books</h3>
                        <a href="/top_books" class="btn btn-danger">View Top Rated</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
