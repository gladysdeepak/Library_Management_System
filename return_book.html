<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Return Book</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h1>Return Book</h1>
        
        <div class="card mt-4">
            <div class="card-body">
                <h5>Returning: {{ borrowing.book_title }}</h5>
                <p>Borrowed by: {{ borrowing.user_name }}</p>
                
                <form method="POST">
                    <input type="hidden" name="book_id" value="{{ borrowing.book_id }}">
                    
                    <div class="mb-3">
                        <label class="form-label">Your User ID:</label>
                        <input type="number" class="form-control" name="user_id" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Rating (1-5 stars):</label>
                        <select class="form-select" name="rating" required>
                            <option value="1">★</option>
                            <option value="2">★★</option>
                            <option value="3">★★★</option>
                            <option value="4">★★★★</option>
                            <option value="5" selected>★★★★★</option>
                        </select>
                    </div>
                    
                    <button type="submit" class="btn btn-primary">Submit</button>
                    <a href="/borrowings" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
